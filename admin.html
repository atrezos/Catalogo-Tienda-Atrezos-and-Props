<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--verde:#506549;--vl:#e8ede7;--feria:#b06030;--fl:#fff4ee;--text:#1a1a1a;--muted:#888;--border:#ddd;--bg:#f8f7f5;--w:#fff}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

nav{background:var(--w);border-bottom:1px solid var(--border);padding:0 1.2rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:.8rem}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--verde);text-decoration:none;white-space:nowrap}
.nav-r{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{border:none;padding:.42rem .9rem;font-family:'Jost',sans-serif;font-size:.78rem;cursor:pointer;border-radius:3px;transition:all .2s;white-space:nowrap}
.btn-p{background:var(--verde);color:#fff}.btn-p:hover{background:#3d4f37}
.btn-o{background:var(--w);color:var(--verde);border:1px solid var(--verde)}.btn-o:hover{background:var(--vl)}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-g:hover{border-color:var(--verde);color:var(--verde)}

/* TABS */
.tabs{background:var(--w);border-bottom:1px solid var(--border);padding:0 1.2rem;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.65rem 1.1rem;font-size:.8rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted);background:none;border-top:none;border-left:none;border-right:none;font-family:'Jost',sans-serif;transition:all .15s}
.tab:hover{color:var(--verde)}
.tab.active{color:var(--verde);border-bottom-color:var(--verde);font-weight:500}

/* HEADER */
.hdr{max-width:920px;margin:1.6rem auto 0;padding:0 1.2rem}
.hdr h1{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400}
.hdr p{font-size:.76rem;color:var(--muted);margin-top:.2rem}

/* PANELS */
.panel{display:none;max-width:920px;margin:1rem auto 4rem;padding:0 1.2rem}
.panel.active{display:block}

/* BLOQUES */
.bloque{background:var(--w);border:1px solid var(--border);border-radius:5px;margin-bottom:.55rem;overflow:hidden}
.bloque-h{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s;user-select:none}
.bloque-h:hover{background:var(--vl)}
.bloque-t{font-family:'Cormorant Garamond',serif;font-size:.98rem;font-style:italic}
.bloque-m{display:flex;align-items:center;gap:.7rem}
.bloque-c{font-size:.7rem;color:var(--muted)}
.chev{font-size:.62rem;color:var(--muted);transition:transform .2s}
.bloque.open .chev{transform:rotate(180deg)}
.bloque-b{display:none;border-top:1px solid var(--border)}
.bloque.open .bloque-b{display:block}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:.67rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:400;padding:.5rem .9rem;text-align:left;border-bottom:1px solid var(--border);background:#fafaf9}
th.r{text-align:right}
th.fth{text-align:right;color:var(--feria)!important}
td{padding:.45rem .9rem;border-bottom:1px solid #f0eeec;vertical-align:middle;font-size:.83rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf9}
.pn{font-weight:400;line-height:1.3}
.pid{font-size:.7rem;color:var(--muted)}

/* BADGES */
.badge{font-size:.67rem;padding:.14rem .42rem;border-radius:20px;white-space:nowrap}
.b0{background:#fdecea;color:#c0392b}
.b1{background:#fff8e1;color:#b7770d}
.bok{background:var(--vl);color:var(--verde)}

/* INPUTS */
.pw{display:flex;align-items:center;justify-content:flex-end;gap:.22rem}
.gs{font-size:.7rem;color:var(--muted)}
.gsf{font-size:.7rem;color:var(--feria)}
input[type=number]{width:108px;border:1px solid var(--border);border-radius:3px;padding:.28rem .45rem;font-family:'Jost',sans-serif;font-size:.82rem;text-align:right;transition:border-color .15s;appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{outline:none;border-color:var(--verde)}
input.changed{border-color:#e8a020;background:#fffdf5}
input.saved{border-color:var(--verde)}
input.feria:focus{border-color:var(--feria)}
input.feria.saved{border-color:var(--feria)}

/* VACÍO */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.83rem}
.empty small{display:block;margin-top:.4rem;font-size:.72rem}

/* TOAST */
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--verde);color:#fff;padding:.6rem 1rem;border-radius:4px;font-size:.78rem;opacity:0;transform:translateY(5px);transition:all .25s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}

/* INFO */
.info{max-width:920px;margin:0 auto;padding:0 1.2rem 2rem;font-size:.74rem;color:var(--muted);line-height:1.6}
.info strong{color:var(--text)}

@media(max-width:600px){input[type=number]{width:82px}th,td{padding-left:.5rem;padding-right:.5rem;-moz-appearance: textfield;appearance: textfield;}}
</style>

// ── STORAGE ───────────────────────────────────────────────────────────────────
const SK='ap_precios', SKF='ap_precios_feria';
const leerN=()=>{try{return JSON.parse(localStorage.getItem(SK))||{};}catch{return{}}};
const leerF=()=>{try{return JSON.parse(localStorage.getItem(SKF))||{};}catch{return{}}};
const guardar=(n,f)=>{localStorage.setItem(SK,JSON.stringify(n));localStorage.setItem(SKF,JSON.stringify(f))};

// ── TABS ──────────────────────────────────────────────────────────────────────
let activa = PAGINAS[0].key;
function renderTabs(){
  document.getElementById('tabs').innerHTML = PAGINAS.map(p=>
    `<button class="tab${p.key===activa?' active':''}" onclick="cambiarPag('${p.key}')">${p.label}</button>`
  ).join('');
}
function cambiarPag(key){
  activa=key; renderTabs();
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.dataset.key===key));
}

// ── BADGE ─────────────────────────────────────────────────────────────────────
const badge=s=>s===0?`<span class="badge b0">Sin stock</span>`:s===1?`<span class="badge b1">Última ud.</span>`:`<span class="badge bok">${s} uds.</span>`;

// ── RENDER PANELES ────────────────────────────────────────────────────────────
function renderPaneles(){
  const n=leerN(), f=leerF();
  const wrap=document.getElementById('paneles');
  wrap.innerHTML='';
  PAGINAS.forEach(pag=>{
    const panel=document.createElement('div');
    panel.className=`panel${pag.key===activa?' active':''}`;
    panel.dataset.key=pag.key;
    const subs=pag.subcats.filter(s=>s.productos.length>0);
    if(!subs.length){
      panel.innerHTML=`<div class="empty">Sin productos cargados aún.<small>Agregá los productos de ${pag.label}.html en el array PAGINAS de este archivo.</small></div>`;
    } else {
      panel.innerHTML=subs.map(sub=>{
        const rows=sub.productos.map(p=>{
          const pn=n[p.id]||'', pf=f[p.id]||'';
          return `<tr>
            <td><div class="pn">${p.nombre}</div><div class="pid">#${p.id}</div></td>
            <td>${badge(p.stock)}</td>
            <td><div class="pw"><span class="gs">Gs.</span>
              <input type="number" class="${pn?'saved':''}" data-id="${p.id}" data-tipo="normal"
                value="${pn}" placeholder="0" min="0" oninput="mc(this)"></div></td>
            <td><div class="pw"><span class="gsf">Gs.</span>
              <input type="number" class="feria ${pf?'saved':''}" data-id="${p.id}" data-tipo="feria"
                value="${pf}" placeholder="0" min="0" oninput="mc(this)"></div></td>
          </tr>`;
        }).join('');
        return `<div class="bloque">
          <div class="bloque-h" onclick="tog(this)">
            <span class="bloque-t">${sub.label}</span>
            <div class="bloque-m"><span class="bloque-c">${sub.productos.length} productos</span><span class="chev">▼</span></div>
          </div>
          <div class="bloque-b">
            <table><thead><tr>
              <th>Producto</th><th>Stock</th>
              <th class="r">Precio normal</th><th class="fth">🏷 Feria</th>
            </tr></thead><tbody>${rows}</tbody></table>
          </div>
        </div>`;
      }).join('');
    }
    wrap.appendChild(panel);
  });
}

// ── INTERACCIÓN ───────────────────────────────────────────────────────────────
function tog(h){h.parentElement.classList.toggle('open')}
function mc(i){i.classList.add('changed');i.classList.remove('saved')}

function guardarTodo(){
  const n=leerN(), f=leerF();
  document.querySelectorAll('input[data-id]').forEach(inp=>{
    const id=parseInt(inp.dataset.id), val=parseInt(inp.value)||0;
    const obj=inp.dataset.tipo==='feria'?f:n;
    if(val>0) obj[id]=val; else delete obj[id];
    inp.classList.remove('changed');
    inp.classList.toggle('saved',val>0);
  });
  guardar(n,f);
  toast('Guardado ✓');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset.id){guardarTodo();e.target.blur()}
});

// ── IMPORT / EXPORT ───────────────────────────────────────────────────────────
function importarJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.normal) localStorage.setItem(SK,JSON.stringify(d.normal));
      if(d.feria)  localStorage.setItem(SKF,JSON.stringify(d.feria));
      renderPaneles(); toast('Importado ✓');
    } catch{ toast('Error al leer el archivo') }
  };
  r.readAsText(file);
}

function exportarJSON(){
  guardarTodo();
  const blob=new Blob([JSON.stringify({normal:leerN(),feria:leerF()},null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'precios.json'});
  a.click(); URL.revokeObjectURL(a.href);
  toast('precios.json descargado — subilo a GitHub');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTabs();
renderPaneles();
</script>
